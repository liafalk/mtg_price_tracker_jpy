<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Search results | JPY MTG Prices</title>
<link rel="stylesheet" href="/static/styles.css">
<script src="/static/i18n.js"></script>
</head>
<body>
  <div class="page-header">
    <h1 id="page-title">JPY MTG Card Prices</h1>

    <div class="language-toggle" aria-label="Card language selector">
      <button type="button" class="lang-btn active" data-language="en">English</button>
      <button type="button" class="lang-btn" data-language="ja">日本語</button>
    </div>
  </div>

  <div class="layout-shell">
    <main class="main-column">
      <div class="search-tools" aria-label="Search tools">
        <form id="search-form" class="inline-search-form">
          <input id="search-term" placeholder="Search card name" autocomplete="off">
          <button id="search-btn" type="submit">Search</button>
        </form>

        <span class="search-divider" aria-hidden="true">or</span>

        <form id="lookup-form" class="inline-search-form">
          <select id="set-code" required>
            <option value="">Select set code</option>
          </select>
          <input id="collector-number" placeholder="Collector number (e.g. 119)" autocomplete="off">
          <button id="submit-btn" type="submit">Look up</button>
        </form>
      </div>

      <div id="error"></div>

      <div id="search-results-page">
        <h2 id="search-results-title">Search results</h2>
        <table id="search-results-table">
          <thead>
            <tr>
              <th>Title</th>
              <th>Thumbnail</th>
              <th>Set</th>
              <th>Number</th>
              <th>Rarity</th>
              <th>Price (EN)</th>
              <th>Price (JP)</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </main>

    <aside class="sidebar-panel" aria-labelledby="recent-sets-title">
      <h2 id="recent-sets-title">Recent sets</h2>
      <ul id="recent-sets" class="recent-set-list"></ul>
    </aside>
  </div>

<script src="/static/search.js"></script>
</body>
</html>
