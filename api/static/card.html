<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Card details | JPY MTG Prices</title>
<link rel="stylesheet" href="/static/styles.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
<script src="/static/i18n.js"></script>
</head>
<body>
  <div class="page-header">
    <h1 id="page-title">JPY MTG Card Prices</h1>

    <div class="language-toggle" aria-label="Card language selector">
      <button type="button" class="lang-btn active" data-language="en">English</button>
      <button type="button" class="lang-btn" data-language="ja">日本語</button>
    </div>
  </div>

  <div class="search-tools" aria-label="Search tools">
    <form id="search-form" class="inline-search-form">
      <input id="search-term" placeholder="Search card name" autocomplete="off">
      <button id="search-btn" type="submit">Search</button>
    </form>

    <span class="search-divider" aria-hidden="true">or</span>

    <form id="lookup-form" class="inline-search-form">
      <select id="set-code" required>
        <option value="">Select set code</option>
      </select>
      <input id="collector-number" placeholder="Collector number (e.g. 119)" autocomplete="off">
      <button id="submit-btn" type="submit">Look up</button>
    </form>
  </div>

  <div id="error"></div>

  <div id="card-header">
    <div class="card-visual">
      <img id="card-image" alt="">
      <button id="flip-card-btn" type="button" hidden>Show back</button>
    </div>
    <div class="card-content">
      <h2 id="card-title"></h2>
      <div id="card-meta"></div>
      <div id="price-summary"></div>
      <div id="chart-wrap">
        <canvas id="price-chart"></canvas>
      </div>
    </div>
  </div>

  <table id="latest-table">
    <thead>
      <tr>
        <th>Language</th>
        <th>Foil</th>
        <th>Price (&yen;)</th>
        <th>Stock</th>
        <th>Weekly sales</th>
        <th>Last updated</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

<script src="/static/card.js"></script>
</body>
</html>
