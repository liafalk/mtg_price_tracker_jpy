<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JPY MTG Prices</title>
<link rel="stylesheet" href="/static/styles.css">
<script src="/static/i18n.js"></script>
</head>
<body>
  <div class="page-header">
    <h1 id="page-title">JPY MTG Card Prices</h1>

    <div class="language-toggle" aria-label="Card language selector">
      <button type="button" class="lang-btn active" data-language="en">English</button>
      <button type="button" class="lang-btn" data-language="ja">日本語</button>
    </div>
  </div>

  <div class="layout-shell">
          <main class="main-column">
            <form id="search-form" style="margin-bottom:0.75rem;">

        <div class="suggestions-container">
          <input id="search-term" placeholder="Search card name" autocomplete="off" data-suggestions style="width: 18rem; position: relative;">
          <ul id="suggestions-list" class="suggestions-list" aria-hidden="true"></ul>
        </div>
        <button id="search-btn" type="submit">Search</button>
      </form>

      <form id="lookup-form">
        <select id="set-code" required>
          <option value="">Select set code</option>
        </select>
        <input id="collector-number" placeholder="Collector number (e.g. 119)" autocomplete="off">
        <button id="submit-btn" type="submit">Look up</button>
      </form>

      <div id="error"></div>
    </main>

    <aside class="sidebar-panel" aria-labelledby="recent-sets-title">
      <h2 id="recent-sets-title">Recent sets</h2>
      <ul id="recent-sets" class="recent-set-list"></ul>
    </aside>
  </div>

<script src="/static/suggestions.js"></script>
<script src="/static/home.js"></script>
</body>
</html>
