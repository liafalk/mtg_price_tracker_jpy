# Manual Japanese name overrides for Scryfall sets.
#
# Most sets get their Japanese name automatically from MTGJSON's
# SetList.json (see scraper/sync_scryfall.fetch_mtgjson_japanese_names).
# This file is for sets where MTGJSON has no translation, or where you
# want to use a different name than what MTGJSON provides.
#
# Format: "<scryfall_set_code>" = "<japanese_name>"  # English name
# Keys are lowercase Scryfall set codes (e.g. "hob", "woe", "mkm").
# Look up the code at https://scryfall.com/sets.
#
# Entries here always win over the MTGJSON value -- so this is also the
# place to fix a wrong or incomplete MTGJSON translation.
#
# Empty strings are skipped, so you can fill in only the sets you care
# about. Newest sets first.

