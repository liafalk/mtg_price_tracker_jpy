# Manual overrides for Hareruya product_code -> Scryfall set_code.
#
# Most sets resolve automatically (lowercase Hareruya's product code,
# check it's a real Scryfall set code -- see
# scraper/sync_scryfall.resolve_scryfall_set_codes). This file is only
# for the ones that don't: older/alternate products where Hareruya's
# code doesn't match Scryfall's convention.
#
# Format: "<hareruya_product_code>" = "<scryfall_set_code>"
# Keys are matched exactly as they appear in Hareruya's product=[XXX]
# query param (see sets.hareruya_product_code) -- check case/spelling
# against what sync_sets.py actually stored if an override doesn't seem
# to take effect.
#
# Entries here always win over the automatic guess, including
# overwriting an already-resolved (possibly wrong) value -- so this is
# also the place to fix a bad automatic match, not just fill in gaps.
#
# Look up the correct code at https://scryfall.com/sets or
# https://api.scryfall.com/sets before adding an entry -- a wrong value
# here silently misattributes prices to the wrong set, which is worse
# than leaving it unresolved (an unresolved set just gets skipped and
# logged loudly).

# --- Verified ---
"10ED" = "10e"    # Tenth Edition
"CE"   = "ced"    # Collector's Edition
"IE"   = "cei"    # International Edition
"PO2"  = "p02"    # Portal Second Age
